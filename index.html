<!DOCTYPE html>
<html lang="en" class="h-full dark bg-black">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>Track &amp; XC Flat HTML / AP Style Converter</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: { 
    extend: { 
      fontFamily: { 
        sans: ['Inter','sans-serif'], 
        mono: ['Fira Code','Courier New','monospace'] 
      } 
    } 
  }
}
</script>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght=400;500&family=Inter:wght=300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
body { font-family: 'Inter', sans-serif; }
.cs::-webkit-scrollbar { width: 8px; height: 8px; }
.cs::-webkit-scrollbar-track { background: #f1f5f9; }
.dark .cs::-webkit-scrollbar-track { background: #1e293b; }
.cs::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
.dark .cs::-webkit-scrollbar-thumb { background: #475569; }
.retro { text-shadow: 0 0 5px rgba(52,211,153,.4); }

.preview-text {
  color: #0f172a; 
}
.dark .preview-text {
  color: #34d399; 
  text-shadow: 0 0 5px rgba(52,211,153,.4);
}

@media (max-width: 1023px) {
  html, body {
    height: auto !important;
    overflow: auto !important;
  }
  main {
    overflow: visible !important;
    flex: none !important;
    display: block !important;
  }

  main > section:first-of-type {
    height: auto !important;
    overflow: visible !important;
  }

  #outputSection {
    height: 100vh !important;
    min-height: 600px;
    overflow: hidden !important;
    display: flex !important;
    flex-direction: column !important;
  }

  #outPreview, #outHtml, #outText {
    font-size: 0.82rem !important;
    line-height: 1.45 !important;
  }

  .output-btn-row {
    flex-wrap: wrap !important;
    gap: 6px;
  }
}

#jumpToOutput {
  display: none;
}
@media (max-width: 1023px) {
  #jumpToOutput {
    display: flex;
    position: fixed;
    bottom: 1.25rem;
    right: 1.25rem;
    z-index: 100;
    align-items: center;
    gap: 0.4rem;
    background: #2563eb;
    color: white;
    font-size: 0.75rem;
    font-weight: 700;
    padding: 0.6rem 1rem;
    border-radius: 9999px;
    box-shadow: 0 4px 18px rgba(37,99,235,0.45);
    border: none;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.2s;
  }
  #jumpToOutput.hidden-btn {
    opacity: 0;
    pointer-events: none;
    transform: translateY(10px);
  }
}

@media print {
  body, html, main {
    background: #ffffff !important;
    color: #000000 !important;
    height: auto !important;
    overflow: visible !important;
  }
  header, 
  section:first-of-type, 
  #toast, 
  #noData, 
  .bg-slate-950.border-b, 
  #paneHtml, 
  #paneText {
    display: none !important;
  }
  main {
    display: block !important;
  }
  section:last-of-type {
    width: 100% !important;
    height: auto !important;
    overflow: visible !important;
    background: #ffffff !important;
    padding: 0 !important;
  }
  #panePreview {
    display: block !important;
    background: #ffffff !important;
    color: #000000 !important;
    border: none !important;
    padding: 0 !important;
    margin: 0 !important;
    overflow: visible !important;
    width: 100% !important;
  }
  #outPreview {
    color: #000000 !important;
    background: #ffffff !important;
    text-shadow: none !important; 
    font-size: 9.5pt !important;
    line-height: 1.25 !important;
    white-space: pre !important;
    width: 100% !important;
  }
}
</style>
</head>
<body class="h-full flex flex-col text-slate-800 dark:text-slate-100 transition-colors duration-200">

<header class="bg-white dark:bg-black border-b border-slate-200 dark:border-slate-900 py-3 px-6 shrink-0 shadow-sm z-20">
  <div class="max-w-7xl mx-auto flex flex-col xl:flex-row items-center justify-between gap-4">
    <div class="flex items-center space-x-3">
      <div id="logoBadge" class="relative bg-blue-600 text-white p-2.5 rounded-lg shadow-md flex items-center justify-center w-11 h-11">
        <i id="logoIcon" class="fa-solid fa-stopwatch text-xl"></i>
      </div>
      <div>
        <h1 class="text-lg font-bold tracking-tight text-slate-900 dark:text-white flex items-center gap-2">
          Track &amp; XC Flat HTML / AP Style Converter
          <span id="modeBadge" class="text-[10px] uppercase tracking-wider px-2 py-0.5 rounded-full bg-blue-100 text-blue-800 dark:bg-blue-900/40 dark:text-blue-300">Track Mode</span>
        </h1>
        <p class="text-xs text-slate-500 dark:text-slate-400">
          Easily change results to look like HyTek Meet Manager Flat HTML Results.
        </p>
      </div>
    </div>
  </div>
</header>

<main class="flex-1 overflow-hidden flex flex-col lg:flex-row">

  <!-- LEFT: Input + Settings -->
  <section class="w-full lg:w-2/5 flex flex-col border-r border-slate-200 dark:border-slate-900 h-full overflow-y-auto cs bg-slate-50/50 dark:bg-black">
    <div class="p-6 space-y-5 max-w-3xl mx-auto w-full">

      <!-- Step 1: Meet Headers -->
      <div class="bg-white dark:bg-slate-950 p-5 rounded-xl border border-slate-200 dark:border-slate-900 shadow-sm space-y-4">
        <div id="step1Header" class="flex items-center space-x-2 text-blue-600 dark:text-blue-400 font-bold text-sm uppercase tracking-wider">
          <span id="step1Badge" class="w-6 h-6 rounded-full bg-blue-100 dark:bg-blue-900/50 flex items-center justify-center text-xs">1</span>
          <span>Meet Headers</span>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div class="md:col-span-2">
            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Meet Title</label>
            <input type="text" id="meetTitle" class="w-full px-3 py-2 bg-slate-50 dark:bg-black border border-slate-200 dark:border-slate-900 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g. Stark County Championship">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Venue / Subtitle</label>
            <input type="text" id="meetVenue" class="w-full px-3 py-2 bg-slate-50 dark:bg-black border border-slate-200 dark:border-slate-900 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g. Perry High School">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Date</label>
            <input type="text" id="meetDate" class="w-full px-3 py-2 bg-slate-50 dark:bg-black border border-slate-200 dark:border-slate-900 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g. 10/12/2026">
          </div>
          <div class="md:col-span-2">
            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Sport</label>
            <div class="flex rounded-lg overflow-hidden border border-slate-200 dark:border-slate-700 w-full">
              <button id="sportToggleTrack" type="button" class="flex-1 py-2 px-4 text-sm font-semibold flex items-center justify-center gap-2 bg-blue-600 text-white">
                <i class="fa-solid fa-stopwatch"></i> Track
              </button>
              <button id="sportToggleXC" type="button" class="flex-1 py-2 px-4 text-sm font-semibold flex items-center justify-center gap-2 bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400">
                <i class="fa-solid fa-person-running"></i> Cross Country
              </button>
            </div>
          </div>

          <input type="hidden" id="meetType" value="track">

          <div id="trackScoringRow" class="md:col-span-2">
            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Track Scoring Rule</label>
            <select id="trackScoringType" class="w-full px-3 py-2 bg-slate-50 dark:bg-black border border-slate-200 dark:border-slate-900 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="standard">Invitational Scoring (8-place: 10-8-6-5-4-3-2-1)</option>
              <option value="seven_place">7-Place Scoring (10-8-6-4-3-2-1)</option>
              <option value="six_team">6-Team Meet Scoring (10-8-6-4-2-1 | Relays: 10-8-6-4-2)</option>
              <option value="five_team">5-Team Meet Scoring (8-6-4-2-1 | Relays: 8-6-4-2)</option>
              <option value="quad">Quad Meet Scoring (6-4-3-2-1 | Relays: 6-4-2)</option>
              <option value="tri">Tri-Meet Scoring (5-3-2-1 | Relays: 5-3)</option>
              <option value="dual">Dual Meet Scoring (5-3-1 | Relays: 5-0)</option>
            </select>
          </div>

          <div id="xcScoringRow" class="md:col-span-2 hidden">
            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Cross Country Scoring Type</label>
            <select id="xcScoringType" class="w-full px-3 py-2 bg-slate-50 dark:bg-black border border-slate-200 dark:border-slate-900 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-amber-400">
              <option value="cross_country" selected>Standard XC Scoring (High School)</option>
              <option value="college_xc">College / Collegiate XC (TFRRS &amp; NCAA Tiebreaker)</option>
            </select>
          </div>
          <div class="md:col-span-2 hidden" id="xcRaceHeaderContainer">
            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Custom XC Race Header</label>
            <input type="text" id="xcRaceHeader" class="w-full px-3 py-2 bg-slate-50 dark:bg-black border border-slate-200 dark:border-slate-900 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g. Boys Division 1 Varsity 5K">
          </div>
        </div>

        <div class="flex flex-wrap gap-4 pt-1">
          <label class="flex items-center text-xs font-medium text-slate-600 dark:text-slate-400 cursor-pointer">
            <input type="checkbox" id="flipNamesCheck" checked class="w-4 h-4 text-blue-600 rounded mr-2"> Format Names: Last, First
          </label>
          <label class="flex items-center text-xs font-medium text-slate-600 dark:text-slate-400 cursor-pointer">
            <input type="checkbox" id="girlsFirstCheck" checked class="w-4 h-4 text-blue-600 rounded mr-2"> <span id="girlsFirstLabel">Girls events before Boys</span>
          </label>
          <label class="flex items-center text-xs font-medium text-slate-600 dark:text-slate-400 cursor-pointer">
            <input type="checkbox" id="showResultsLabelCheck" checked class="w-4 h-4 text-blue-600 rounded mr-2"> Include "Results" centered header
          </label>
        </div>
      </div>

      <!-- Step 2: Paste Area -->
      <div class="bg-white dark:bg-slate-950 p-5 rounded-xl border border-slate-200 dark:border-slate-900 shadow-sm space-y-3">
        <div class="flex items-center justify-between">
          <div id="step2Header" class="flex items-center space-x-2 text-blue-600 dark:text-blue-400 font-bold text-sm uppercase tracking-wider">
            <span id="step2Badge" class="w-6 h-6 rounded-full bg-blue-100 dark:bg-blue-900/50 flex items-center justify-center text-xs">2</span>
            <span>Paste Results or Upload File</span>
          </div>
          <button id="clearBtn" class="text-xs text-rose-500 hover:text-rose-600 font-medium flex items-center gap-1">
            <i class="fa-solid fa-trash-can"></i> Clear
          </button>
        </div>
        
        <div id="dropZone" class="relative rounded-lg border border-dashed border-slate-200 dark:border-slate-900 p-1">
          <textarea id="rawInput" rows="12" class="w-full px-3 py-2 font-mono text-xs bg-slate-50 dark:bg-black border-0 rounded-lg focus:outline-none focus:ring-0 cs block" placeholder="Paste full results here or drop a .txt/.html file…"></textarea>
        </div>

        <div class="flex justify-between items-center">
          <label class="bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 px-3 py-1.5 rounded-lg text-xs font-semibold cursor-pointer flex items-center gap-2 transition">
            <i class="fa-solid fa-file-import"></i> Upload File
            <input type="file" id="fileInput" class="hidden" accept=".txt,.html,.htm,.csv">
          </label>
          <button id="processBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg text-sm shadow-md flex items-center gap-2 transition">
            <i class="fa-solid fa-gears"></i> Build Hy-Tek File
          </button>
        </div>
      </div>

      <!-- Console Log -->
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-2">
        <button id="consoleToggle" class="w-full flex items-center justify-between text-xs font-semibold text-slate-300 uppercase tracking-wider">
          <span class="flex items-center gap-2"><i class="fa-solid fa-terminal text-blue-500"></i> Status Console</span>
        </button>
        <div id="consoleLog" class="pt-2 border-t border-slate-800 text-[10px] font-mono text-amber-400 space-y-0.5 max-h-40 overflow-y-auto cs">
          <div class="text-slate-500">> System Ready...</div>
        </div>
      </div>
    </div>
  </section>

  <!-- RIGHT: Output Panel -->
  <section id="outputSection" class="w-full lg:w-3/5 flex flex-col h-full bg-slate-100 dark:bg-black text-slate-800 dark:text-slate-100 border-t lg:border-t-0 lg:border-l border-slate-200 dark:border-slate-900 overflow-hidden">
    <div class="bg-slate-50 dark:bg-slate-950/40 border-b border-slate-200 dark:border-slate-900 flex flex-col sm:flex-row items-center justify-between px-6 py-3 shrink-0 gap-2">
      <div class="flex items-center gap-2">
        <div class="flex space-x-1">
          <button id="tabPreview" class="px-3 py-1.5 text-xs font-semibold rounded-md bg-blue-600 text-white flex items-center gap-1.5">
            <i class="fa-solid fa-desktop"></i> Preview
          </button>
          <button id="tabHtml" class="px-3 py-1.5 text-xs font-semibold rounded-md text-slate-500 hover:text-slate-900 dark:hover:text-white flex items-center gap-1.5">
            <i class="fa-solid fa-code"></i> HTML Source
          </button>
        </div>
      </div>
      <div class="flex flex-wrap items-center gap-1.5 output-btn-row">
        <button id="copyBtn" class="bg-slate-200 hover:bg-slate-300 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 px-3 py-1.5 rounded-lg text-xs font-medium">
          <i class="fa-regular fa-copy mr-1"></i>Copy
        </button>
        <button id="downloadBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg text-xs font-medium">
          <i class="fa-solid fa-download mr-1"></i>Save .htm
        </button>
      </div>
    </div>

    <div class="flex-1 p-4 overflow-hidden flex flex-col relative">
      <div id="noData" class="absolute inset-0 bg-slate-100/95 dark:bg-black/95 flex flex-col items-center justify-center text-center p-6 z-10">
        <div class="w-16 h-16 rounded-full bg-slate-200 dark:bg-slate-800 flex items-center justify-center mb-4 text-blue-500">
          <i class="fa-solid fa-file-import text-2xl"></i>
        </div>
        <h3 class="text-lg font-bold">Ready to Convert</h3>
        <p class="text-slate-500 dark:text-slate-400 text-xs mt-2 max-w-sm">Paste results on the left, then click Build Hy-Tek File.</p>
      </div>

      <div id="panePreview" class="flex-1 overflow-auto bg-white dark:bg-black rounded-xl border border-slate-200 dark:border-slate-900 p-4 cs hidden">
        <pre id="outPreview" class="whitespace-pre font-mono text-xs preview-text"></pre>
      </div>
      <div id="paneHtml" class="flex-1 overflow-auto bg-slate-50 dark:bg-black rounded-xl border border-slate-200 dark:border-slate-900 p-4 cs hidden">
        <pre id="outHtml" class="whitespace-pre-wrap font-mono text-xs text-slate-700 dark:text-slate-300 select-all"></pre>
      </div>
    </div>
  </section>

</main>

<script>
// Tab Switching & Sport Toggle Logic
const sportToggleTrack = document.getElementById('sportToggleTrack');
const sportToggleXC = document.getElementById('sportToggleXC');
const trackScoringRow = document.getElementById('trackScoringRow');
const xcScoringRow = document.getElementById('xcScoringRow');
const xcRaceHeaderContainer = document.getElementById('xcRaceHeaderContainer');
const meetType = document.getElementById('meetType');
const modeBadge = document.getElementById('modeBadge');
const logoIcon = document.getElementById('logoIcon');

sportToggleTrack.addEventListener('click', () => {
  sportToggleTrack.className = 'flex-1 py-2 px-4 text-sm font-semibold flex items-center justify-center gap-2 bg-blue-600 text-white';
  sportToggleXC.className = 'flex-1 py-2 px-4 text-sm font-semibold flex items-center justify-center gap-2 bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400';
  trackScoringRow.classList.remove('hidden');
  xcScoringRow.classList.add('hidden');
  xcRaceHeaderContainer.classList.add('hidden');
  meetType.value = 'track';
  modeBadge.textContent = 'Track Mode';
  logoIcon.className = 'fa-solid fa-stopwatch text-xl';
});

sportToggleXC.addEventListener('click', () => {
  sportToggleXC.className = 'flex-1 py-2 px-4 text-sm font-semibold flex items-center justify-center gap-2 bg-[#ffdd00] text-gray-950';
  sportToggleTrack.className = 'flex-1 py-2 px-4 text-sm font-semibold flex items-center justify-center gap-2 bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400';
  trackScoringRow.classList.add('hidden');
  xcScoringRow.classList.remove('hidden');
  xcRaceHeaderContainer.classList.remove('hidden');
  meetType.value = 'cross_country';
  modeBadge.textContent = 'XC Mode';
  logoIcon.className = 'fa-solid fa-person-running text-xl';
});

// Processing Logic
const processBtn = document.getElementById('processBtn');
const rawInput = document.getElementById('rawInput');
const outPreview = document.getElementById('outPreview');
const outHtml = document.getElementById('outHtml');
const noData = document.getElementById('noData');
const panePreview = document.getElementById('panePreview');
const paneHtml = document.getElementById('paneHtml');
const tabPreview = document.getElementById('tabPreview');
const tabHtml = document.getElementById('tabHtml');

processBtn.addEventListener('click', () => {
  const text = rawInput.value.trim();
  if (!text) {
    alert('Please paste some results first!');
    return;
  }
  
  const title = document.getElementById('meetTitle').value || 'Meet Results';
  const venue = document.getElementById('meetVenue').value || '';
  const date = document.getElementById('meetDate').value || '';

  let formattedText = `${title}\n${venue}\n${date}\n\n${text}`;

  outPreview.textContent = formattedText;
  outHtml.textContent = `<html><body><pre>${formattedText}</pre></body></html>`;

  noData.classList.add('hidden');
  panePreview.classList.remove('hidden');
});

tabPreview.addEventListener('click', () => {
  panePreview.classList.remove('hidden');
  paneHtml.classList.add('hidden');
  tabPreview.className = 'px-3 py-1.5 text-xs font-semibold rounded-md bg-blue-600 text-white flex items-center gap-1.5';
  tabHtml.className = 'px-3 py-1.5 text-xs font-semibold rounded-md text-slate-500 hover:text-slate-900 dark:hover:text-white flex items-center gap-1.5';
});

tabHtml.addEventListener('click', () => {
  paneHtml.classList.remove('hidden');
  panePreview.classList.add('hidden');
  tabHtml.className = 'px-3 py-1.5 text-xs font-semibold rounded-md bg-blue-600 text-white flex items-center gap-1.5';
  tabPreview.className = 'px-3 py-1.5 text-xs font-semibold rounded-md text-slate-500 hover:text-slate-900 dark:hover:text-white flex items-center gap-1.5';
});

document.getElementById('clearBtn').addEventListener('click', () => {
  rawInput.value = '';
  noData.classList.remove('hidden');
  panePreview.classList.add('hidden');
  paneHtml.classList.add('hidden');
});

document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(outPreview.textContent);
  alert('Copied to clipboard!');
});

document.getElementById('downloadBtn').addEventListener('click', () => {
  const blob = new Blob([outHtml.textContent], { type: 'text/html' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'results.htm';
  a.click();
});
</script>
</body>
</html>
